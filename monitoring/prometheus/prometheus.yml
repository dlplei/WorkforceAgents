global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'workforce-agent'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'host.containers.internal:8000'
          - 'host.docker.internal:8000'
          - 'localhost:8000'
        labels:
          app: 'workforce-operations-agent'
          env: 'local-dev'
