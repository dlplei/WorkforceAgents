version: '3.8'

services:
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/postgres:18-alpine
    container_name: workforce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - workforce_pg_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: workforce_chroma
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "8002:8000"
    volumes:
      - workforce_chroma_data:/chroma/chroma

  prometheus:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/prom/prometheus:v3.1.0
    container_name: workforce_prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.containers.internal:${HOST_IP:-172.25.176.1}"
      - "host.docker.internal:${HOST_IP:-172.25.176.1}"
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - workforce_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/grafana/grafana:11.5.1
    container_name: workforce_grafana
    restart: unless-stopped
    extra_hosts:
      - "host.containers.internal:${HOST_IP:-172.25.176.1}"
      - "host.docker.internal:${HOST_IP:-172.25.176.1}"
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - workforce_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:7-alpine
    container_name: workforce_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - workforce_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: workforce_ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      # 挂载已有卷 chatbi-automotive_ollama_data，无需重复下载 BGE-M3 等模型权重
      - chatbi-automotive_ollama_data:/root/.ollama
    environment:
      HTTP_PROXY: "http://proxy.emea.ibm.com:8080"
      HTTPS_PROXY: "http://proxy.emea.ibm.com:8080"
      NO_PROXY: "localhost,127.0.0.1,0.0.0.0,ollama"

volumes:
  workforce_pg_data:
  workforce_chroma_data:
  workforce_prometheus_data:
  workforce_grafana_data:
  workforce_redis_data:
  chatbi-automotive_ollama_data:
    external: true

